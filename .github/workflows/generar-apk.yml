name: Generar APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v7

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Instalar Android 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Quitar wrapper no oficial
        run: rm -f gradle/wrapper/gradle-wrapper.jar

      - name: Instalar Gradle 8.7 oficial
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: gradle --no-daemon assembleDebug

      - name: Preparar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ColectivosRosario.apk

      - name: Subir APK
        uses: actions/upload-artifact@v7
        with:
          name: ColectivosRosario-APK
          path: ColectivosRosario.apk
          archive: false
          if-no-files-found: error
